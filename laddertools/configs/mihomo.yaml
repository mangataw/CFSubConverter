# Public template for mangataw/LadderTools.
# Keep secrets and subscription URLs out of this file. The Worker replaces only
# ${WORKER_ORIGIN}; all rule names remain constrained by its compiled allowlist.
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

proxy-groups:
  - name: 节点选择
    type: select
    proxies: [自动选择, 香港节点, 日本节点, 台湾节点, 美国节点, 狮城节点, 手动切换节点, 手动切换分组, DIRECT]
  - name: 手动切换节点
    type: select
    include-all: true
  - name: 手动切换分组
    type: select
    proxies: [香港节点, 日本节点, 美国节点, 台湾节点, 狮城节点, 韩国节点, 澳洲节点, 德国节点, 荷兰节点, 英国节点, 爱沙节点, DIRECT]
  - name: 自动选择
    type: url-test
    include-all: true
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 香港节点
    type: url-test
    include-all: true
    filter: "(?i)香港|港|HK|Hong Kong|HongKong"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 日本节点
    type: url-test
    include-all: true
    filter: "(?i)日本|东京|大阪|埼玉|JP|Japan"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 美国节点
    type: url-test
    include-all: true
    filter: "(?i)美国|美西|美东|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|USA|United States"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 20
  - name: 台湾节点
    type: url-test
    include-all: true
    filter: "(?i)台湾|台北|新北|彰化|TW|Taiwan"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 狮城节点
    type: url-test
    include-all: true
    filter: "(?i)新加坡|狮城|SG|Singapore"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 韩国节点
    type: url-test
    include-all: true
    filter: "(?i)韩国|首尔|KR|Korea|KOR|韓國"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 澳洲节点
    type: url-test
    include-all: true
    filter: "(?i)澳大利亚|澳洲|AU|Australia|AUS"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 德国节点
    type: url-test
    include-all: true
    filter: "(?i)德国|DE|Germany|Deutschland|GER"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 荷兰节点
    type: url-test
    include-all: true
    filter: "(?i)荷兰|NL|Netherlands|Holland"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 英国节点
    type: url-test
    include-all: true
    filter: "(?i)英国|UK|England|GB|GBR"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 爱沙节点
    type: url-test
    include-all: true
    filter: "(?i)爱沙尼亚|EE|Estonia|EST"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 非日节点
    type: url-test
    include-all: true
    exclude-filter: "(?i)日本|东京|大阪|埼玉|JP|Japan"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 10
  - name: 奈飞节点
    type: select
    include-all: true
    filter: "(?i)NF|奈飞|解锁|Netflix|Media"
  - name: AI
    type: select
    proxies: [日本节点, 美国节点, 狮城节点, 澳洲节点, 德国节点]
  - name: 电报消息
    type: select
    proxies: [香港节点, 节点选择, 狮城节点, 台湾节点, 日本节点, 美国节点, 韩国节点, 手动切换分组, DIRECT]
  - name: 谷歌服务
    type: select
    proxies: [日本节点, 美国节点, 香港节点, 台湾节点, 狮城节点, 韩国节点, 澳洲节点]
  - name: 游戏平台
    type: select
    proxies: [美国节点, 日本节点, 节点选择, 香港节点, 台湾节点, 狮城节点, 韩国节点, 手动切换分组, DIRECT]
  - name: 油管视频
    type: select
    proxies: [节点选择, 狮城节点, 香港节点, 台湾节点, 日本节点, 美国节点, 韩国节点, 手动切换分组, DIRECT]
  - name: 奈飞视频
    type: select
    proxies: [奈飞节点, 节点选择, 狮城节点, 香港节点, 台湾节点, 日本节点, 美国节点, 韩国节点, 手动切换分组, DIRECT]
  - name: 巴哈姆特
    type: select
    proxies: [台湾节点, 节点选择, 手动切换分组, DIRECT]
  - name: 国外媒体
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 狮城节点, 日本节点, 美国节点, 韩国节点, 手动切换分组, DIRECT]
  - name: 微软云盘
    type: select
    proxies: [DIRECT, 节点选择, 美国节点, 香港节点, 台湾节点, 狮城节点, 日本节点, 韩国节点, 手动切换分组]
  - name: 微软服务
    type: select
    proxies: [DIRECT, 节点选择, 美国节点, 香港节点, 台湾节点, 狮城节点, 日本节点, 韩国节点, 手动切换分组]
  - name: 苹果服务
    type: select
    proxies: [DIRECT, 节点选择, 美国节点, 香港节点, 台湾节点, 狮城节点, 日本节点, 韩国节点, 手动切换分组]
  - name: 网易音乐
    type: select
    proxies: [DIRECT, 节点选择]
  - name: 哔哩哔哩
    type: select
    proxies: [DIRECT, 节点选择, 台湾节点, 香港节点, 手动切换分组]
  - name: 国内媒体
    type: select
    proxies: [DIRECT, 节点选择, 香港节点, 台湾节点, 狮城节点, 日本节点, 手动切换分组]
  - name: 全球直连
    type: select
    proxies: [DIRECT, 节点选择, 手动切换分组]
  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT]
  - name: 应用净化
    type: select
    proxies: [REJECT, DIRECT]
  - name: 漏网之鱼
    type: select
    proxies: [DIRECT, 节点选择, 香港节点, 台湾节点, 狮城节点, 日本节点, 美国节点, 韩国节点, 手动切换分组]

